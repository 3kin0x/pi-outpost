<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installing the interface as an app: the manifest is what a browser reads
         to offer it, and the theme colour is what an installed window paints its
         title bar with. Both belong to the standalone document only — a mounted
         widget never owns its host page's head. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7e14ff" />
    <title>pi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
